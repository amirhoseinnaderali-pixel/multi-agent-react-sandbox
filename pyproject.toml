[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vmar-ps"
version = "0.1.0"
description = "Verified Multi-Agent ReAct for Iterative Program Synthesis"
requires-python = ">=3.9"
dependencies = [
  "docker>=6.0.0",
  "google-genai>=1.0.0",
  "matplotlib>=3.8.0",
  "pandas>=2.0.0",
  "psutil>=5.9.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
